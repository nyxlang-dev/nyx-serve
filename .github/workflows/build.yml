name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build with Nyx toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git libgc-dev libssl-dev zlib1g-dev

      - name: Install Nyx toolchain
        run: |
          curl -sSf https://nyxlang.com/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: nyx --version

      - name: Build product
        run: nyx build

      - name: Verify binary produced
        run: |
          BIN=$(basename "$PWD")
          if [ ! -x "./$BIN" ]; then
              echo "ERROR: binary $BIN not found after nyx build"
              exit 1
          fi
          echo "✓ Binary $BIN produced successfully"
          ls -lh "./$BIN"

      # The .nx unit tests (make test-template) need the dev bootstrap
      # toolchain ($NYX_HOME/nyx_bootstrap + runtime sources), which the
      # public installer does not ship — they run locally via make test-serve.
      - name: Smoke test (HTTP + WebSocket against ephemeral daemon)
        run: NYX_SERVE_BIN="$PWD/$(basename "$PWD")" python3 tests/test_serve_smoke.py
